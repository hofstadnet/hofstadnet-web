name: Bygg

# Bygger siden på hver pull request og på main. Bygget stopper ved typefeil, ved innlegg som
# bryter innholdsmodellen og ved innebygd kode som Content-Security-Policy ville blokkert.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Installerer nøyaktig det låsefilen sier, uten å kjøre installasjonsskript fra pakkene.
      - run: npm ci --ignore-scripts

      # Sjekker at alle pakkene er signert av npm-registeret og har gyldig opphav (provenance),
      # så en manipulert pakke fra et speil eller en mellommann blir stoppet.
      - name: Signaturer på npm-pakkene
        run: |
          # Registeret svarer av og til med feil. Prøver tre ganger før bygget stopper.
          for i in 1 2 3; do npm audit signatures && exit 0; sleep 15; done; exit 1

      - name: Enhetstester
        run: npm run test:unit

      - run: npm run build

      - name: Ingen innebygd kode i HTML
        run: node scripts/check-csp.mjs

      - name: security.txt er ikke i ferd med å utløpe
        run: node scripts/check-security-txt.mjs

      - name: Dokumentasjonen peker på ting som finnes
        run: node scripts/check-docs.mjs
