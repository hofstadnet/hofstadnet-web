name: Quality

# Lighthouse (ytelse, tilgjengelighet, beste praksis, SEO) og tilgjengelighetstester med axe på hver
# pull request. Grensene står i lighthouserc.json og tests/accessibility.spec.ts. Rapportene lastes opp
# som artefakter på kjøringen.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: 'Lag nye godkjente skjermbilder (lastes opp som artefakten «screenshots»)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:lighthouse
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      # Henter Chromium i versjonen som er låst i @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        if: ${{ !inputs.update_screenshots }}
      # Lager nye skjermbilder i stedet for å sammenligne. Mangler et bilde, lages det også ved vanlig kjøring.
      - run: npx playwright test tests/visual.spec.ts --update-snapshots=all
        if: ${{ inputs.update_screenshots }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
          retention-days: 14
