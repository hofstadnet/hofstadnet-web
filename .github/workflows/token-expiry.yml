name: Token expiry

# Sjekker hver mandag når Cloudflare-tokenet til OpenTofu (CLOUDFLARE_API_TOKEN) utløper, og om det fortsatt
# virker. Under 30 dager igjen, eller et token som ikke virker, gir en issue (bare én om gangen). Sjekken bruker
# tokenet selv (tokens/verify) og trenger ingen nye rettigheter.
# R2-tokenet (hofstadnet-tofu-state) kan ikke sjekkes på samme måte, men ble laget samme dag med samme utløp.

on:
  schedule:
    - cron: '41 5 * * 1' # mandager 05:41 UTC
  workflow_dispatch:
    inputs:
      warn_days:
        description: 'Varsle når færre enn så mange dager er igjen (sett høyt for å teste issuen)'
        default: '30'

permissions:
  contents: read

jobs:
  check:
    if: vars.TOFU_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      ACCOUNT_ID: b055719a9337c9d844c7b41ee78fcad9
      WARN_DAYS: ${{ inputs.warn_days || '30' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Sjekk tokenet hos Cloudflare
        id: token
        run: |
          set -euo pipefail
          response=$(curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/tokens/verify" || echo '{}')
          token_status=$(jq -r '.result.status // "ugyldig"' <<<"$response")
          expires=$(jq -r '.result.expires_on // ""' <<<"$response")
          if [ "$token_status" != "active" ]; then
            message="Cloudflare-tokenet til OpenTofu virker ikke lenger (status: $token_status)."
          elif [ -z "$expires" ]; then
            message=""
            echo "Tokenet er aktivt og har ingen utløpsdato."
          else
            days=$(( ( $(date -d "$expires" +%s) - $(date +%s) ) / 86400 ))
            echo "Tokenet er aktivt og utløper $expires (om $days dager)."
            if ! [[ "$WARN_DAYS" =~ ^[0-9]+$ ]]; then WARN_DAYS=30; fi
            if [ "$days" -le "$WARN_DAYS" ]; then
              message="Cloudflare-tokenet til OpenTofu utløper ${expires%%T*} (om $days dager)."
            else
              message=""
            fi
          fi
          echo "message=$message" >> "$GITHUB_OUTPUT"
          echo "### Tokenutløp" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: $token_status. Utløper: ${expires:-ingen dato}." >> "$GITHUB_STEP_SUMMARY"

      - name: Opprett issue
        if: steps.token.outputs.message != ''
        env:
          MESSAGE: ${{ steps.token.outputs.message }}
        run: |
          set -euo pipefail
          TITLE="Forny Cloudflare-tokenene til OpenTofu"
          if gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq 'length' | grep -qv '^0$'; then
            echo "Det finnes allerede en åpen issue."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$MESSAGE

          Slik fornyer du (se også infra/README.md):
          1. Cloudflare → Manage Account → Account API tokens → \`hofstadnet-tofu\` → Roll, eller lag et nytt med samme rettigheter.
          2. \`gh secret set CLOUDFLARE_API_TOKEN\`
          3. Gjør det samme for R2-tokenet \`hofstadnet-tofu-state\` (R2 → Manage API tokens): \`gh secret set R2_ACCESS_KEY_ID\` og \`gh secret set R2_SECRET_ACCESS_KEY\`.
          4. Kjør Actions → Infrastructure → Run workflow. Planen skal vise «No changes».

          Byggetokenet \`hofstadnet-web-builds\` har ingen utløpsdato."
