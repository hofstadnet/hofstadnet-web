name: Infrastructure

# Cloudflare-oppsettet i infra/ (OpenTofu). Se infra/README.md.
#  - check: formatering og validering på hver endring, også pull requests. Trenger ingen hemmeligheter.
#  - plan: viser hva som vil endres, i oppsummeringen av kjøringen. Kjører på main (etter merge, Run workflow og
#    hver mandag), i miljøet «tofu-plan»: lesetokenet til Cloudflare og et R2-token som bare kan lese state.
#  - apply: gjennomfører den lagrede planen fra plan-jobben, etter godkjenning i miljøet «cloudflare». Skrivetokenet
#    til Cloudflare og R2-tokenet som kan skrive state, ligger bare der.
#  Begge miljøene tillater bare main, og repoet har ingen hemmeligheter. En branch eller pull request kan derfor
#  verken lese state, se passfrasen eller endre Cloudflare.
#  - drift: hver mandag kjøres planen mot Cloudflare. Viser den endringer, er noe endret utenfor koden
#    (f.eks. i dashbordet), og det opprettes en issue. Ingenting endres automatisk.

on:
  pull_request:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  schedule:
    - cron: '23 5 * * 1' # mandager 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra/hofstad.net

env:
  TOFU_VERSION: 1.13.9

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Validering leser ikke state, men krypteringsblokken trenger en verdi
      TF_VAR_state_passphrase: bare-for-validering-ingen-hemmelighet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu fmt -check -recursive -diff ..
      - id: lock
        run: |
          if [ -f .terraform.lock.hcl ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - run: tofu init -backend=false -input=false
      # Første gang lages låsefilen med sjekksummer for provideren. Den lastes opp, så den kan legges i repoet.
      - if: steps.lock.outputs.exists == 'false'
        run: tofu providers lock -platform=linux_amd64 -platform=windows_amd64 -platform=darwin_arm64
      - if: steps.lock.outputs.exists == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-lock
          path: infra/hofstad.net/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 7
      - run: tofu validate

  # plan og apply kjører først når repovariabelen TOFU_ENABLED er «true», etter at nøklene er lagt inn.
  # Ikke på pull requests: miljøet tillater bare main.
  plan:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.TOFU_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: tofu-plan
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    env:
      # Miljøsecrets i «tofu-plan». Bare lesetilgang til Cloudflare og R2.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READ }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu init -input=false
      # -lock=false: R2-tokenet kan bare lese, så planen kan ikke lage låsefilen. Planen skriver ikke state, og
      #   concurrency-gruppen «infra» hindrer at den kjører samtidig med apply.
      # -parallelism=4: færre samtidige kall, så Cloudflare-API-et ikke svarer med rate limiting.
      # -detailed-exitcode: 0 = ingen endringer, 1 = feil, 2 = endringer. Apply kjører bare ved 2.
      # pipefail: uten den ville en feilet plan blitt grønn, fordi tee alltid lykkes.
      - id: plan
        run: |
          set -o pipefail
          code=0
          tofu plan -input=false -lock=false -parallelism=4 -no-color -detailed-exitcode -out=plan.bin | tee plan.txt || code=$?
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then echo "changes=true" >> "$GITHUB_OUTPUT"; else echo "changes=false" >> "$GITHUB_OUTPUT"; fi
          # Oppsummeringen viser antallet og hver ressurs med før- og etter-verdier, så godkjenneren ser nøyaktig hva
          # som endres. Verdier merket sensitive (f.eks. ALERT_EMAIL) skjuler OpenTofu selv. Teksten er den samme som i
          # loggen, som også er offentlig.
          {
            echo '### OpenTofu-plan'
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
            if [ "$code" -eq 2 ]; then
              echo '<details open><summary>Endringene</summary>'
              echo
              echo '```diff'
              sed -n '/^  # /,/^Plan:/p' plan.txt | grep -v '^Plan:' | sed -E 's/^( *)([~+-]) /\2\1 /' | head -c 60000 || true
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Planen lastes opp, så apply gjennomfører nøyaktig den planen som ble vist og godkjent. Filen er kryptert
      # med passfrasen (encryption.plan i versions.tf), så artefakten er ikke lesbar uten den.
      - if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tofu-plan
          path: infra/hofstad.net/plan.bin
          retention-days: 1

  apply:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.plan.outputs.changes == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    env:
      # Miljøsecrets i «cloudflare». Skrivetokenet og R2-tokenet som kan skrive state.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu init -input=false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tofu-plan
          path: infra/hofstad.net
      # Gjennomfører den lagrede planen. Har state endret seg siden planen ble laget, stopper OpenTofu
      # («saved plan is stale»), og da må kjøringen startes på nytt, så det lages en ny plan å godkjenne.
      - run: tofu apply -input=false -lock-timeout=2m -parallelism=4 -no-color plan.bin

  drift:
    if: github.event_name == 'schedule' && needs.plan.outputs.changes == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Opprett issue om avvik
        working-directory: .
        run: |
          set -euo pipefail
          TITLE="Cloudflare-oppsettet avviker fra infra/"
          if gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq 'length' | grep -qv '^0$'; then
            echo "Det finnes allerede en åpen issue."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "Den ukentlige planen viser at Cloudflare ikke lenger stemmer med koden i \`infra/\`. Noe er trolig endret i dashbordet.

          Se planen i oppsummeringen av kjøringen: $RUN_URL

          Velg én av to:
          - Endringen skal beholdes: legg den inn i \`infra/\` i en PR, så planen blir «No changes».
          - Endringen skal bort: kjør Actions → Infrastructure → Run workflow på main og godkjenn apply. Da settes Cloudflare tilbake til koden."
