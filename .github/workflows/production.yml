name: Produksjon

# Ukentlig sjekk av den publiserte siden på https://hofstad.net: Lighthouse og de samme tilgjengelighets- og
# CSP-testene som kjøres på hver pull request. Fanger opp endringer som skjer utenfor repoet, som
# Cloudflare-innstillinger, Web Analytics-skriptet og LiveTrack24. Feiler kjøringen, varsler GitHub eier.

on:
  schedule:
    - cron: '17 5 * * 1' # mandager 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npx lhci autorun --config=lighthouserc.production.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-production
          path: lighthouse-report/
          retention-days: 30

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # Bygget trengs bare for listen over sider (nettstedskartet). Testene kjører mot https://hofstad.net.
      - run: npm run build
      - run: npm run test:e2e
        env:
          PRODUCTION: '1'
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-production
          path: playwright-report/
          retention-days: 30
